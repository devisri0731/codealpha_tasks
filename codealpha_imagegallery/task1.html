<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Image Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}
body{
    background:white;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:black;
}
/* Filter Buttons */
.filters{
    text-align:center;
    margin-bottom:25px;
}

.filters button{
    padding:10px 20px;
    margin:5px;
    border:none;
    background:black;
    color:white;
    cursor:pointer;
    border-radius:5px;
    transition:0.3s;
}

.filters button:hover,
.filters button.active{
    background:orangered;
}

/* Gallery */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.image{
    overflow:hidden;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.image img{
    width:100%;
    height:250px;
    object-fit:cover;
    cursor:pointer;
    transition:transform 0.4s ease, filter 0.4s ease;
}

/* Hover Effect */
.image:hover img{
    transform:scale(1.1);
    filter:brightness(80%);
}

/* Lightbox */
.lightbox{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.lightbox img{
    max-width:80%;
    max-height:80%;
    border-radius:10px;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    color:white;
    font-size:40px;
    cursor:pointer;
}

.prev, .next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,0.2);
    color:white;
    border:none;
    padding:15px;
    font-size:25px;
    cursor:pointer;
    border-radius:50%;
}

.prev{ left:20px; }
.next{ right:20px; }

.prev:hover,
.next:hover{
    background:rgba(255,255,255,0.5);
}

/* Responsive */
@media(max-width:768px){
    .lightbox img{
        max-width:95%;
    }

    .prev,.next{
        padding:10px;
        font-size:20px;
    }
}
</style>
</head>

<body>

<h1>Responsive Image Gallery</h1>

<div class="filters">
    <button class="active" onclick="filterImages('all', this)">All</button>
    <button onclick="filterImages('nature', this)">Nature</button>
    <button onclick="filterImages('city', this)">City</button>
    <button onclick="filterImages('animals', this)">Animals</button>
</div>

<div class="gallery">

    <div class="image nature">
        <img src="https://picsum.photos/id/1015/600/400" alt="Nature">
    </div>

    <div class="image city">
        <img src="https://picsum.photos/id/1011/600/400" alt="City">
    </div>

    <div class="image animals">
        <img src="https://picsum.photos/id/1025/600/400" alt="Animal">
    </div>

    <div class="image nature">
        <img src="https://picsum.photos/id/1039/600/400" alt="Nature">
    </div>

    <div class="image city">
        <img src="https://picsum.photos/id/1043/600/400" alt="City">
    </div>

    <div class="image animals">
        <img src="https://picsum.photos/id/1062/600/400" alt="Animal">
    </div>

</div>

<!-- Lightbox -->
<div class="lightbox">
    <span class="close">&times;</span>

    <button class="prev">&#10094;</button>

    <img id="lightbox-img" src="" alt="">

    <button class="next">&#10095;</button>
</div>

<script>
const images = document.querySelectorAll(".gallery img");
const lightbox = document.querySelector(".lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const closeBtn = document.querySelector(".close");
const nextBtn = document.querySelector(".next");
const prevBtn = document.querySelector(".prev");

let currentIndex = 0;

// Open Lightbox
images.forEach((img, index) => {
    img.addEventListener("click", () => {
        currentIndex = index;
        showImage();
        lightbox.style.display = "flex";
    });
});

function showImage(){
    lightboxImg.src = images[currentIndex].src;
}

// Close Lightbox
closeBtn.addEventListener("click", () => {
    lightbox.style.display = "none";
});

// Next Image
nextBtn.addEventListener("click", () => {
    currentIndex++;
    if(currentIndex >= images.length){
        currentIndex = 0;
    }
    showImage();
});

// Previous Image
prevBtn.addEventListener("click", () => {
    currentIndex--;
    if(currentIndex < 0){
        currentIndex = images.length - 1;
    }
    showImage();
});

// Filter Images
function filterImages(category, button){

    const items = document.querySelectorAll(".image");

    items.forEach(item => {
        if(category === "all"){
            item.style.display = "block";
        } else {
            item.style.display =
            item.classList.contains(category)
            ? "block"
            : "none";
        }
    });

    document.querySelectorAll(".filters button").forEach(btn=>{
        btn.classList.remove("active");
    });

    button.classList.add("active");
}

// Keyboard Navigation
document.addEventListener("keydown", (e) => {

    if(lightbox.style.display === "flex"){

        if(e.key === "ArrowRight"){
            nextBtn.click();
        }

        if(e.key === "ArrowLeft"){
            prevBtn.click();
        }

        if(e.key === "Escape"){
            lightbox.style.display = "none";
        }
    }
});
</script>

</body>
</html>
